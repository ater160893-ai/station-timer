<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>ステ時間管理（テスト版）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;padding:16px 12px 36px;max-width:760px;margin-inline:auto}h1{font-size:24px;margin:4px 0 6px}h2{font-size:18px;margin:0 0 12px}p.help,.notice{font-size:13px;color:#526170;line-height:1.5}section{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #17212b0c}label{display:block;font-size:14px;font-weight:600;margin:10px 0 5px}input,select,textarea,button{font:inherit;width:100%;border-radius:9px;border:1px solid #cbd5df;padding:10px;background:white;color:inherit}textarea{min-height:65px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}button{border:0;background:#17324d;color:white;font-weight:700;margin-top:10px;padding:12px}button.secondary{background:#e7edf3;color:#17324d}button.danger{background:#fff0ef;color:#a32a22}.station{border:1px solid #dce4eb;border-radius:12px;padding:12px;margin:10px 0}.station strong{font-size:16px}.muted{font-size:12px;color:#637181}.when{font-size:14px;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{flex:1;padding:8px;margin-top:8px;min-width:60px}#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fb;border:1px solid #dce4eb;border-radius:9px;padding:12px;min-height:100px;font-size:14px}@media(min-width:560px){body{padding:24px}}
</style></head><body>
<h1>ステ時間管理</h1><p class="help">テスト版です。今のアプリを残したまま、こちらで動作を確認できます。</p>
<section><h2>ステを登録・編集</h2><input id="editId" type="hidden"><label>ステの種類</label><select id="type"><option>武器4</option><option>武器2</option><option>防御4</option><option>防御2</option><option>遠征3</option><option>建築3</option><option>建築1</option><option>技術3</option><option>技術1</option><option>訓練1</option><option>採集1</option><option>生産1</option></select><div class="row"><div><label>場所・識別名（任意）</label><input id="label" placeholder="例：北側"></div><div><label>区分</label><select id="role"><option value="main">メイン</option><option value="sub">サブ</option></select></div></div><label>開放までの残り時間（最大3日）</label><div class="grid"><div><label>日</label><select id="days"></select></div><div><label>時間</label><select id="hours"></select></div><div><label>分</label><select id="mins"></select></div></div><label>コメント（任意）</label><textarea id="comment" placeholder="例：来る同盟、必要人数など"></textarea><div class="row"><button id="save" onclick="saveStation()">登録する</button><button class="secondary" onclick="resetForm()">入力をクリア</button></div><p class="notice">保存した時点から、入力した残り時間を計算します。</p></section>
<section><h2>登録済みステ</h2><div class="row"><div><label>表示順</label><select id="sort" onchange="render()"><option value="time">開放時間順</option><option value="custom">自由順</option></select></div><div><label>コピー対象の日付</label><input id="cutoff" type="date" onchange="renderOutput()"></div></div><label>共通の指示（任意）</label><input id="common" placeholder="例：あと5人募集" oninput="renderOutput()"><div id="stations"></div><p class="notice">コピー対象の日付は、その日の午前0時までに開放するステが対象です。自由順では矢印で並び替えできます。</p></section>
<section><h2>コピーする文章</h2><div id="output"></div><button onclick="copyOutput()">文章をコピー</button><p class="notice" id="status" aria-live="polite"></p></section>
<script>
const KEY='wos_station_timer_v2';let stations=[];const $=id=>document.getElementById(id);function fill(id,max){for(let i=0;i<=max;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0');$(id).appendChild(o)}}fill('days',3);fill('hours',23);fill('mins',59);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function name(s){return (s.label?s.label+' ':'')+s.type+'ステ'}function fmt(ts,utc=false){let d=new Date(ts),m=utc?d.getUTCMonth()+1:d.getMonth()+1,day=utc?d.getUTCDate():d.getDate(),h=utc?d.getUTCHours():d.getHours(),mi=utc?d.getUTCMinutes():d.getMinutes();return `${m}/${day} ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}function line(s){return `${fmt(s.openAt)}（UTC ${fmt(s.openAt,true).split(' ')[1]}）`}function ordered(){let a=[...stations];a.sort($('sort').value==='time'?(x,y)=>x.openAt-y.openAt:(x,y)=>(x.order||0)-(y.order||0));return [...a.filter(s=>s.role!=='sub'),...a.filter(s=>s.role==='sub')]}function persist(){localStorage.setItem(KEY,JSON.stringify(stations))}function render(){let root=$('stations');root.innerHTML='';let arr=ordered();if(!arr.length)root.innerHTML='<p class="muted">まだステが登録されていません。</p>';arr.forEach((s,i)=>{let r=document.createElement('div');r.className='station';let rem=Math.max(0,Math.ceil((s.openAt-Date.now())/60000));r.innerHTML=`<strong>${esc(name(s))}</strong> <span class="muted">［${s.role==='sub'?'サブ':'メイン'}］</span><div class="when">${esc(line(s))}</div><div class="muted">残り ${Math.floor(rem/1440)}日 ${Math.floor(rem%1440/60)}時間 ${rem%60}分</div>${s.comment?`<div class="when">${esc(s.comment)}</div>`:''}<div class="actions"><button class="secondary" onclick="move('${s.id}',-1)" ${$('sort').value!=='custom'||i===0?'disabled':''}>↑ 上へ</button><button class="secondary" onclick="move('${s.id}',1)" ${$('sort').value!=='custom'||i===arr.length-1?'disabled':''}>↓ 下へ</button><button class="secondary" onclick="edit('${s.id}')">編集</button><button class="danger" onclick="del('${s.id}')">削除</button></div>`;root.appendChild(r)});renderOutput()}function saveStation(){let total=+$('days').value*1440+ +$('hours').value*60+ +$('mins').value;if(total>4320){alert('残り時間は最大3日です');return}let id=$('editId').value||String(Date.now())+Math.random().toString(16).slice(2),old=stations.find(s=>s.id===id);let s={id,type:$('type').value,label:$('label').value.trim(),role:$('role').value,comment:$('comment').value.trim(),openAt:Date.now()+total*60000,order:old?old.order:stations.length};if(old)stations=stations.map(x=>x.id===id?s:x);else stations.push(s);persist();resetForm();render()}function resetForm(){$('editId').value='';$('label').value='';$('role').value='main';$('comment').value='';$('days').value='0';$('hours').value='0';$('mins').value='0';$('save').textContent='登録する'}function edit(id){let s=stations.find(x=>x.id===id);if(!s)return;let r=Math.max(0,Math.ceil((s.openAt-Date.now())/60000));$('editId').value=s.id;$('type').value=s.type;$('label').value=s.label||'';$('role').value=s.role||'main';$('comment').value=s.comment||'';$('days').value=Math.min(3,Math.floor(r/1440));$('hours').value=Math.floor(r%1440/60);$('mins').value=r%60;$('save').textContent='変更を保存';scrollTo({top:0,behavior:'smooth'})}function del(id){if(!confirm('このステを削除しますか？'))return;stations=stations.filter(s=>s.id!==id);stations.forEach((s,i)=>s.order=i);persist();render()}function move(id,dir){if($('sort').value!=='custom')return;let a=ordered(),i=a.findIndex(s=>s.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((s,i)=>s.order=i);stations=a;persist();render()}function renderOutput(){let cutoff=$('cutoff').value,end=cutoff?new Date(cutoff+'T00:00:00').getTime():Infinity;let a=ordered().filter(s=>s.openAt<=end),lines=["Today's Stations",''];a.forEach(s=>{lines.push('▪️'+name(s),line(s));if(s.comment)lines.push(s.comment)});let common=$('common').value.trim();if(common)lines.push(common);$('output').textContent=lines.join('\n')}async function copyOutput(){try{await navigator.clipboard.writeText($('output').textContent);$('status').textContent='コピーできました。ゲームに貼り付けてください。'}catch(e){let a=document.createElement('textarea');a.value=$('output').textContent;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();$('status').textContent=ok?'コピーできました。ゲームに貼り付けてください。':'コピーできませんでした。文章を長押ししてコピーしてください。'}}function init(){try{stations=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){stations=[]}let d=new Date();$('cutoff').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;render()}init();
</script></body></html>
